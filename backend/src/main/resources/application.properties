spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION}

aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.s3.bucket=${AWS_BUCKET}
aws.region=${AWS_REGION}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Cornell-specific auth ---
# Only emails ending in @<this domain> can register.
app.verification.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:cornell.edu}
app.verification.code-expiry-minutes=${VERIFICATION_CODE_EXPIRY_MINUTES:15}

# --- Outbound mail (used to send the verification code) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@cornellmarketplace.app}